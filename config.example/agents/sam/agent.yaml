# Sam — agent manifest (template).
#
# This file is NOT tracked in git on real deployments — it's mutated at
# runtime by `grant`/`revoke` from Slack and is part of each host's
# private state under config/. Copy it into config/agents/sam/agent.yaml
# on a fresh host, then let `grant sam <pack>` manage `packs:` for you.

name: Sam
container: sam
thinking_status: "is digging in…"

# Router-side wall-clock timeout in seconds for this agent's container.
# Sam is a parent agent dispatching long-running tasks (up to 50 turns on
# Sonnet ≈ 17-21 min), so 1800s keeps the wall-clock budget above that.
# Omit or set to null to use the global SESSION_TIMEOUT env var (default 1800s).
container_timeout: 1800

# This agent owns the per-dispatch workspace bind-mount (./var/dispatch ↔
# /var/lib/dispatch) used by the headless dispatch pack. Exactly one agent
# should carry this flag; it also makes this agent the default auto-dispatch
# worker unless AUTO_DISPATCH_WORKER_AGENT overrides it.
dispatch_workspace: true

# Slack identity for this agent.  Values use ${SECRET:ENV_VAR_NAME} syntax;
# the router resolves each reference from the environment at startup and
# fails loud if any secret is missing.
backends:
  slack:
    bot_token: ${SECRET:SAM_BOT_TOKEN}
    app_token: ${SECRET:SAM_APP_TOKEN}
    signing_secret: ${SECRET:SAM_SIGNING_SECRET}
  # Discord (optional — requires DISCORD_ENABLED=true in the router env).
  # Create a bot at https://discord.com/developers/applications, enable the
  # MESSAGE CONTENT privileged intent, and add SAM_DISCORD_BOT_TOKEN to .env.
  # discord:
  #   bot_token: ${SECRET:SAM_DISCORD_BOT_TOKEN}
  #   default_channel_id: "123456789012345678"   # plain snowflake string

# Packs are appended/removed by `grant sam <pack>` / `revoke sam <pack>`.
# See packs/<name>/ for what each one wires in.
packs:
  - github

scheduled_tasks:
  - name: nightly-tech-debt-sweep
    prompt: >-
      Nightly tech-debt sweep: scan issues tagged tech-debt, review recent
      post-mortems under /config/agents/sam/memory/, and check recent
      router_logs for recurring errors. Post a top-3 triage to Bram's DM.
    schedule_cron: "0 3 * * *"
    enabled: true
    timeout_seconds: 1800
