# Sam — agent manifest (template).
#
# This file is NOT tracked in git on real deployments — it's mutated at
# runtime by `grant`/`revoke` from Slack and is part of each host's
# private state under config/. Copy it into config/agents/sam/agent.yaml
# on a fresh host, then let `grant sam <pack>` manage `packs:` for you.

name: Sam
container: sam
thinking_status: "is digging in…"

# Packs are appended/removed by `grant sam <pack>` / `revoke sam <pack>`.
# See packs/<name>/ for what each one wires in.
packs:
  - github

scheduled_tasks:
  - name: nightly-tech-debt-sweep
    prompt: >-
      Nightly tech-debt sweep: scan issues tagged tech-debt, review recent
      post-mortems under /config/agents/sam/memory/, and check recent
      router_logs for recurring errors. Post a top-3 triage to Bram's DM.
    schedule_cron: "0 3 * * *"
    enabled: true
    timeout_seconds: 1800
