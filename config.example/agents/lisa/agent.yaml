# Lisa — agent manifest (template).
#
# This file is NOT tracked in git on real deployments — it's mutated at
# runtime by `grant`/`revoke` from Slack and is part of each host's
# private state under config/. Copy it into config/agents/lisa/agent.yaml
# on a fresh host, then let `grant lisa <pack>` manage `packs:` for you.
#
# Single source of truth for everything router-side that's specific to
# Lisa: identity (used to be router/config.py AGENT_MAP) and scheduled
# task seeds (used to be router/scheduled_tasks/seeds.py
# DEFAULT_SEED_TASKS). The agent id is the directory name (here:
# "lisa"). Adding/removing an agent = adding/removing this folder.

name: Lisa                  # display name
container: lisa             # docker container; default = directory name
thinking_status: "is reviewing findings…"
# container_timeout: 1800   # optional: per-agent wall-clock timeout in seconds;
#                           # omit to use the global SESSION_TIMEOUT (default 1800s)

# Slack identity for this agent.  Values use ${SECRET:ENV_VAR_NAME} syntax;
# the router resolves each reference from the environment at startup and
# fails loud if any secret is missing.
backends:
  slack:
    bot_token: ${SECRET:LISA_BOT_TOKEN}
    app_token: ${SECRET:LISA_APP_TOKEN}
    signing_secret: ${SECRET:LISA_SIGNING_SECRET}

# Packs are appended/removed by `grant lisa <pack>` / `revoke lisa <pack>`.
# M365 (Bram's mail and calendar) is reached via the native Claude
# connector and described in role.md — no pack needed.
packs:
  - zoho-mail

scheduled_tasks:
  - name: Daily inbox review
    prompt: >-
      Summarize yesterday's inbox activity for Bram: what came in, what you
      handled, what still needs his attention. Post the summary to my DM with
      Bram.
    schedule_cron: "0 9 * * 1-5"
    enabled: false
