quota:
  threshold_usd: 50
  window_hours: 5

approval:
  require_always: false             # full-auto (2026-06-29, Bram approved): dispatch+merge unattended on safe path; smart gate below holds destructive/over-spend
  destructive_keywords:             # used only when require_always is false
    - destructive
    - delete
    - drop
    - migration
    - reset

# Formal GitHub PR reviews (pr_review verb). The reviewing agent's PAT path
# and the GitHub login that PAT must resolve to. Config, not code: renaming
# the review agent means editing this block, nothing else. Unconfigured →
# the verb refuses fail-closed.
pr_review:
  token_path: /config/secrets/gh-aidt-sam.token
  identity: aidt-tl-sam

auto_dispatch:
  enabled: true                     # kill switch — flip to true to activate the loop
  rate_per_hour: 3                  # max dispatches per hour (cadence gate)
  daily_cap: 12                     # max dispatches per day (persisted across restarts)
  shadow_mode: false                # true → log "would dispatch" but never spawn; false → real dispatch (still gated by approval.require_always)
