[project]
name = "ai-dev-team"
version = "0.1.0"
description = "Multi-agent AI dev team orchestrated via Slack"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (may need Docker)",
    "e2e: End-to-end tests (slow, needs full stack)",
]
filterwarnings = [
    "error",
    "ignore:coroutine '_session_cleanup_loop' was never awaited:RuntimeWarning",
    "ignore:coroutine 'run_forever' was never awaited:RuntimeWarning",
]
[tool.coverage.run]
source = ["router"]

[tool.coverage.report]
# Ratchet: measured router/ coverage was ~87.8% when this was raised from 80.
# Raise further toward the 90% Definition-of-Done target as coverage grows;
# never lower it.
fail_under = 85

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
