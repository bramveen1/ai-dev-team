services:
  router:
    build:
      context: .
      dockerfile: router/Dockerfile
    environment:
      # Per-agent Slack credentials. The router builds one Bolt app per agent
      # whose <NAME>_BOT_TOKEN / <NAME>_APP_TOKEN / <NAME>_SIGNING_SECRET trio
      # is set. Add a new line per agent here as you add agents to AGENT_MAP.
      - LISA_BOT_TOKEN=${LISA_BOT_TOKEN}
      - LISA_APP_TOKEN=${LISA_APP_TOKEN}
      - LISA_SIGNING_SECRET=${LISA_SIGNING_SECRET}
      - SAM_BOT_TOKEN=${SAM_BOT_TOKEN}
      - SAM_APP_TOKEN=${SAM_APP_TOKEN}
      - SAM_SIGNING_SECRET=${SAM_SIGNING_SECRET}
      - SESSION_TIMEOUT=${SESSION_TIMEOUT:-600}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/config
      - ./systems:/systems
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      - lisa
      - sam
    restart: unless-stopped

  lisa:
    build:
      context: ./agents/lisa
      dockerfile: Dockerfile
    container_name: lisa
    environment:
      - CLAUDE_CODE_DISABLE_AUTO_MEMORY=1
    volumes:
      - ./config:/config
      - ./systems:/systems
      - lisa-claude-config:/home/claude/.claude
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  sam:
    build:
      context: ./agents/sam
      dockerfile: Dockerfile
    container_name: sam
    environment:
      - CLAUDE_CODE_DISABLE_AUTO_MEMORY=1
    volumes:
      - ./config:/config
      - ./systems:/systems
      - sam-claude-config:/home/claude/.claude
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

volumes:
  lisa-claude-config:
  sam-claude-config:
