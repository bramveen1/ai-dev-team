# This file is GENERATED by scripts/render_compose.py from
# config/agents/*/agent.yaml manifests. Do not edit by hand — your changes
# will be overwritten the next time the renderer runs.
#
# Local-only tweaks should go in docker-compose.override.yml (Compose's
# native escape hatch), which the renderer never touches.

services:
  router:
    build:
      context: .
      dockerfile: router/Dockerfile
    environment:
    - SESSION_TIMEOUT=${SESSION_TIMEOUT:-600}
    - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
    - SLASH_COMMAND_PREFIX=${SLASH_COMMAND_PREFIX:-}
    - WORKER_MENTION_HANDOFF=${WORKER_MENTION_HANDOFF:-0}
    ports:
    - 127.0.0.1:${HEALTHZ_PORT:-8080}:8080
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./config:/config
    - ./systems:/systems
    - ./packs:/app/packs:ro
    - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on: []
    restart: unless-stopped
  browser-use:
    container_name: browser-use
    profiles:
    - browser
    build:
      context: .
      dockerfile: docker/Dockerfile.browser
    environment:
    - BROWSER_USE_PROFILES_DIR=/config/browser_profiles
    - BROWSER_USE_SECRETS_DIR=/config/secrets/browser
    - BROWSER_USE_AGE_KEYFILE=/run/secrets/age.key
    volumes:
    - ./config/browser_profiles:/config/browser_profiles
    - ./config/secrets/browser:/config/secrets/browser
    - ./packs/browser_use:/opt/pack:ro
    secrets:
    - source: age_key
      target: age.key
    deploy:
      resources:
        limits:
          memory: 2g
    restart: on-failure:3
volumes:
  agent-tools: null
secrets:
  age_key:
    file: ${AGE_KEYFILE:-/etc/ai-dev-team/age.key}
