name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded pushes to the same ref cancel their in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Pin ruff so a new release's formatting rules can't silently red-gate
      # every PR + main (e.g. 0.16.0 began reformatting Python blocks inside
      # markdown). Bump this deliberately, alongside a `ruff format .` sweep.
      - run: pip install ruff==0.16.0
      - run: ruff check .
      - run: ruff format --check .

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            router/requirements.txt
      - run: pip install -r requirements-dev.txt -r router/requirements.txt
      - name: Seed config/ from config.example/
        run: make seed-config
      - name: Run unit tests
        run: |
          pytest tests/unit -v --cov=router --cov-report=term-missing --cov-fail-under=85 -m unit

  slack-sdk-boundary-guard:
    # Blocking (#553): slack_sdk may only be imported from the Slack adapter
    # boundary (router/chat/adapters/). See tests/unit/test_slack_sdk_boundary.py
    # for the equivalent pytest-level guard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: slack_sdk imported only under router/chat/adapters/
        run: |
          OFFENDERS=$(grep -rlE '^\s*(import slack_sdk|from slack_sdk)' --include="*.py" router/ \
            | grep -v '^router/chat/adapters/' || true)
          if [ -n "$OFFENDERS" ]; then
            echo "slack_sdk imported outside router/chat/adapters/:"
            echo "$OFFENDERS"
            exit 1
          fi
          echo "OK — slack_sdk imports confined to router/chat/adapters/"

  slack-post-boundary-guard:
    # Blocking (#857, extends #553): the slack_post best-effort-post primitive
    # (router/chat/adapters/slack_post.py) may only be imported through the
    # adapter package, never resurrected at the old top-level router.slack_post
    # path. Raw AsyncWebClient is already covered by slack-sdk-boundary-guard
    # above, since the only source of a raw AsyncWebClient is a slack_sdk
    # import. See tests/unit/test_slack_sdk_boundary.py for the equivalent
    # pytest-level guard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: slack_post imported only via router.chat.adapters
        run: |
          OFFENDERS=$(grep -rlE '^\s*(from router import ([[:alnum:]_, ]*, *)?slack_post\b|from router\.slack_post import|import router\.slack_post\b)' \
            --include="*.py" router/ || true)
          if [ -n "$OFFENDERS" ]; then
            echo "slack_post imported at the old top-level router.slack_post path:"
            echo "$OFFENDERS"
            exit 1
          fi
          if [ ! -f router/chat/adapters/slack_post.py ]; then
            echo "router/chat/adapters/slack_post.py is missing"
            exit 1
          fi
          if [ -f router/slack_post.py ]; then
            echo "router/slack_post.py must not exist — slack_post lives under router/chat/adapters/ (#857)"
            exit 1
          fi
          echo "OK — slack_post confined to router/chat/adapters/"

  core-platform-branch-guard:
    # Blocking (#553): router/ (outside the adapter boundary) must stay
    # transport-neutral — no `if transport == "<name>"`-style branching.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no platform branching in router/ (outside adapters)
        run: |
          OFFENDERS=$(grep -rnE "transport\s*==\s*\"[^\"]*\"|transport\s*==\s*'[^']*'" --include="*.py" router/ \
            | grep -v '^router/chat/adapters/' || true)
          if [ -n "$OFFENDERS" ]; then
            echo "Platform branching found outside router/chat/adapters/ — see docs/chat-backends-architecture.md"
            echo "$OFFENDERS"
            exit 1
          fi
          echo "OK — no platform branching outside router/chat/adapters/"

  test-integration:
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            router/requirements.txt
      - run: pip install -r requirements-dev.txt -r router/requirements.txt
      - name: Seed config/ from config.example/
        run: make seed-config
      - name: Run integration tests
        run: |
          pytest tests/integration -v -m integration

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seed config/ from config.example/
        run: make seed-config
      - name: Build router image
        run: docker build -f router/Dockerfile -t test-router .

  compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install pyyaml
      - name: Seed config/ from config.example/
        run: make seed-config
      - name: docker-compose.yml is in sync with config/agents/
        run: python -m scripts.render_compose --check
